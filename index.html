<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다인에듀 DAINEDU — 세계로 가는 언어</title>
<meta name="description" content="다인에듀 — 교육부 인가 온라인 스페인어 학원. 현장에서 배운 진짜 스페인어.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   다인에듀 인트로 (라이트) — 설정은 <script> 맨 위 CONFIG
   ============================================================ */
:root{
  --bg:#faf7f1; --ink:#0f1a3a; --muted:#5b6478;
  --coral:#ff5d3a; --gold:#f2b63c; --sky:#3aa0ff; --mint:#22c99a; --violet:#8b6cff; --peach:#ffd7c2;
  --ease:cubic-bezier(.77,0,.18,1); --ease2:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Montserrat',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
#intro{position:fixed;inset:0;overflow:hidden;background:var(--bg)}

/* 상단 바 */
.topbar{position:absolute;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px clamp(18px,4vw,56px);pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:900}
.brand .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--coral),var(--gold));display:grid;place-items:center;font-family:'Montserrat';font-weight:800;color:#fff;font-size:17px;box-shadow:0 8px 20px rgba(255,93,58,.3)}
.brand .name{font-size:18px;line-height:1}
.brand .name small{display:block;font-family:'Montserrat';font-weight:600;font-size:10px;letter-spacing:.28em;color:var(--muted);margin-top:4px}
.skip{background:#fff;border:1px solid rgba(15,26,58,.12);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(15,26,58,.06);transition:.25s}
.skip:hover{background:var(--ink);color:#fff}

/* 패널 */
.panel{position:absolute;inset:0;display:flex;align-items:center;overflow:hidden;transform:translateX(-100%);opacity:0;visibility:hidden;will-change:transform,opacity}
.panel.active{transform:none;opacity:1;visibility:visible;transition:transform 1.05s var(--ease),opacity .6s ease;z-index:2}
.panel.leave{transform:translateX(100%);opacity:0;visibility:visible;transition:transform 1.05s var(--ease),opacity .7s ease .3s;z-index:1}
.photo{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.08)}
.panel.active .photo.has{opacity:.22;transform:scale(1);transition:opacity 1.4s ease .3s,transform 9s linear}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 40s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(5%,7%) scale(1.08)}}
.inner{position:relative;z-index:3;width:100%;max-width:1320px;margin:0 auto;padding:0 clamp(22px,6vw,80px);display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,64px);align-items:center}

.a{opacity:0;transform:translateX(-56px);filter:blur(6px)}
.panel.active .a{animation:slideIn 1s var(--ease2) forwards;animation-delay:var(--d,0s)}
@keyframes slideIn{to{opacity:1;transform:none;filter:blur(0)}}

.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:'Montserrat';font-weight:600;letter-spacing:.3em;font-size:clamp(10px,1vw,12px);text-transform:uppercase;color:var(--coral)}
.eyebrow::before{content:"";width:34px;height:2px;background:var(--coral)}
h1{font-weight:900;line-height:1.08;letter-spacing:-.03em;font-size:clamp(40px,6.4vw,92px);margin:20px 0 22px}
.accent{background:linear-gradient(90deg,var(--coral),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(16px,1.5vw,22px);font-weight:400;color:var(--muted);letter-spacing:-.01em}
.sub b{color:var(--ink);font-weight:700}
.visual{position:relative;display:grid;place-items:center;min-height:min(50vh,560px)}

/* 1 지구본 */
#p1 .b1{width:50vw;height:50vw;background:#bfe0ff;top:-25%;right:-12%}
#p1 .b2{width:36vw;height:36vw;background:var(--peach);bottom:-20%;left:-10%;animation-delay:-6s}
.globe{width:min(40vw,440px);aspect-ratio:1;filter:drop-shadow(0 30px 50px rgba(27,63,156,.25))}
.globe svg{width:100%;height:100%;overflow:visible}
@keyframes spin{to{transform:rotate(360deg)}}
.drift{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.drift span{position:absolute;left:-30vw;font-family:'Montserrat','Noto Sans KR';font-weight:800;white-space:nowrap;color:rgba(15,26,58,.035);animation:drift linear infinite}
@keyframes drift{to{transform:translateX(160vw)}}


/* 스페인어권 국가 돌출 애니메이션 */
.es .c{opacity:0;transform:scale(1);stroke:#fff;stroke-width:.9;stroke-linejoin:round;transform-box:view-box}
.panel.active .es .c{animation:popOut 1.5s cubic-bezier(.3,1.6,.4,1) forwards;animation-delay:var(--d)}
@keyframes popOut{
  0%{opacity:0;transform:scale(.3) translate(4px,8px);filter:drop-shadow(0 0 0 rgba(15,26,58,0)) brightness(1)}
  40%{opacity:1;transform:scale(1.9) translate(-4px,-10px);filter:drop-shadow(-14px 22px 14px rgba(15,26,58,.5)) drop-shadow(-4px 8px 2px rgba(15,26,58,.35)) brightness(1.25)}
  62%{transform:scale(1.02) translate(0,0);filter:drop-shadow(-2px 4px 4px rgba(15,26,58,.3)) brightness(1)}
  80%{transform:scale(1.32) translate(-2px,-4px);filter:drop-shadow(-8px 12px 10px rgba(15,26,58,.42)) drop-shadow(-3px 5px 1px rgba(15,26,58,.3)) brightness(1.1)}
  100%{opacity:1;transform:scale(1.18) translate(-1px,-2px);filter:drop-shadow(-6px 9px 8px rgba(15,26,58,.4)) drop-shadow(-2px 4px 1px rgba(15,26,58,.3)) brightness(1)}
}

.es .mk{fill:none;stroke:#22c99a;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.panel.active .es .mk{animation:mkPulse 2.4s ease-out infinite;animation-delay:var(--d)}
@keyframes mkPulse{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(2.2)}}

/* 2 지도 */
#p2 .b1{width:48vw;height:48vw;background:#c9f3e6;top:-20%;left:-12%}
#p2 .b2{width:34vw;height:34vw;background:#fff0b8;bottom:-18%;right:-8%;animation-delay:-5s}
.map{width:100%;max-width:680px}
.map svg{width:100%;height:auto;overflow:visible}
.map .grid line{stroke:rgba(15,26,58,.07)}
.map .city{fill:rgba(34,201,154,.55)}
.map .route{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-dasharray:6 8;stroke-dashoffset:1000;opacity:0}
.panel.active .map .route{animation:dash 3.2s ease-out .9s forwards}
@keyframes dash{0%{stroke-dashoffset:1000;opacity:1}100%{stroke-dashoffset:0;opacity:1}}
.pin{opacity:0;transform-origin:center;transform-box:fill-box}
.panel.active .pin{animation:pop .7s var(--ease2) forwards;animation-delay:var(--d)}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
.pin .pulse{fill:none;stroke:var(--coral);stroke-width:2;animation:pulse 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.6);opacity:0}}
.pin text{font-family:'Noto Sans KR';font-weight:900;font-size:30px;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:7px}

/* 3 인증 */
#p3 .b1{width:46vw;height:46vw;background:#ffd9d0;top:-18%;right:-10%}
#p3 .b2{width:32vw;height:32vw;background:#dcd4ff;bottom:-15%;left:-6%;animation-delay:-7s}
.seals{display:flex;gap:clamp(14px,2vw,28px);align-items:center;justify-content:center;flex-wrap:wrap}
.seal{width:clamp(150px,15vw,230px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 20px 50px rgba(15,26,58,.1);display:grid;place-items:center;text-align:center;position:relative}
.seal::before{content:"";position:absolute;inset:10px;border-radius:50%;border:2px dashed rgba(255,93,58,.45);animation:spin 40s linear infinite}
.seal .y{font-family:'Montserrat';font-weight:800;font-size:clamp(30px,3.4vw,50px);line-height:1;background:linear-gradient(135deg,var(--coral),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.seal .t{font-size:clamp(12px,1vw,14px);font-weight:700;margin-top:8px;line-height:1.35;padding:0 14px}

/* 4 언어 */
#p4 .b1{width:50vw;height:50vw;background:#d8ecff;top:-24%;left:-10%}
#p4 .b2{width:36vw;height:36vw;background:#ffe5c2;bottom:-20%;right:-10%;animation-delay:-4s}
.cloud{position:relative;width:100%;height:min(52vh,520px)}
.cloud span{position:absolute;font-family:'Montserrat','Noto Sans KR';font-weight:800;white-space:nowrap;line-height:1;opacity:0;transform:translateX(-40px) scale(.9)}
.panel.active .cloud span{animation:wordIn .9s var(--ease2) forwards, bob 5s ease-in-out infinite alternate;animation-delay:var(--d),calc(var(--d) + .9s)}
@keyframes wordIn{to{opacity:1;transform:none}}
@keyframes bob{to{translate:0 -10px}}

/* 5 CTA */
#p5 .b1{width:56vw;height:56vw;background:#ffdccf;top:-28%;left:20%}
#p5 .b2{width:40vw;height:40vw;background:#c9f3e6;bottom:-22%;right:-8%;animation-delay:-8s}
#p5 .inner{grid-template-columns:1fr;text-align:center}
#p5 .eyebrow{justify-content:center}
.cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:36px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:18px 32px;border-radius:999px;font-weight:900;font-size:17px;transition:.25s}
.btn.main{background:var(--ink);color:#fff;box-shadow:0 14px 34px rgba(15,26,58,.25)}
.btn.main:hover{transform:translateY(-2px);background:var(--coral);box-shadow:0 18px 40px rgba(255,93,58,.35)}
.btn.ghost{background:#fff;border:1px solid rgba(15,26,58,.14);color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn svg{width:18px;height:18px}

/* 와이프 */
.wipe{position:absolute;inset:-10% -30%;z-index:40;pointer-events:none;display:flex;transform:translateX(-120%)}
.wipe i{flex:1;background:var(--ink);transform:skewX(-14deg)}
.wipe i:nth-child(2){background:var(--coral)}
.wipe i:nth-child(3){background:var(--gold)}
.wipe.go{animation:wipe 1.15s var(--ease) forwards}
@keyframes wipe{to{transform:translateX(120%)}}

/* 하단 */
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:50;padding:0 clamp(18px,4vw,56px) 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.dots{display:flex;gap:10px}
.dot{width:38px;height:4px;border-radius:4px;background:rgba(15,26,58,.14);border:0;position:relative;overflow:hidden;padding:0}
.dot i{position:absolute;inset:0;width:0;background:var(--coral)}
.dot.done i{width:100%}
.dot.cur i{animation:fill var(--dur) linear forwards}
@keyframes fill{to{width:100%}}
.counter{font-family:'Montserrat';font-weight:600;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.ctrl{display:flex;gap:8px}
.ctrl button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(15,26,58,.14);background:#fff;color:var(--ink);display:grid;place-items:center;transition:.2s}
.ctrl button:hover{background:var(--ink);color:#fff}
.ctrl svg{width:16px;height:16px}

@media (max-width:900px){
  .panel{align-items:stretch}
  .inner{grid-template-columns:1fr!important;gap:14px;padding:90px 22px 100px;overflow-y:auto;height:100%;align-content:start}
  .visual{order:-1;min-height:0;max-height:30vh}
  .globe{width:min(54vw,230px)}
  h1{font-size:clamp(34px,10vw,46px);margin:14px 0 14px}
  .sub{font-size:15px}
  .seal{width:30vw}
  .cloud{height:30vh}
  .cta{margin-top:20px;gap:10px}.btn{padding:14px 22px;font-size:15px}
  .counter{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="intro" aria-label="다인에듀 인트로">


  <!-- 1 -->
  <section class="panel" id="p1" data-dur="8000">
    <div class="photo"></div><div class="blob b1"></div><div class="blob b2"></div>
    <div class="drift" id="drift"></div>
    <div class="inner">
      <div>
        <span class="eyebrow a" style="--d:.5s">DAINEDU</span>
        <h1 class="a" style="--d:.7s">스페인어는,<br><span class="accent">세계로 가는</span><br>가장 빠른 길</h1>
        <p class="sub a" style="--d:1s">교육부 인가 온라인 스페인어 학원, <b>다인에듀</b></p>
      </div>
      <div class="visual a" style="--d:.6s">
        <div class="globe">
          <svg viewBox="0 0 400 400">
            <defs>

              <radialGradient id="gloss" cx="30%" cy="22%" r="40%"><stop offset="0" stop-color="rgba(255,255,255,.55)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></radialGradient>
              <clipPath id="sphere"><circle cx="200" cy="200" r="150"/></clipPath>
            </defs>
            <circle cx="200" cy="200" r="164" fill="none" stroke="rgba(15,26,58,.08)" stroke-width="1"/>
            <circle cx="200" cy="200" r="150" fill="url(#ocean)"/>

                <path class="c" d="M310.7,204.6L313.5,204.3L313.6,207.4L311.1,207.7L310.5,207.9L310.2,207.6Z" fill="#22c99a" style="--d:3.80s;transform-origin:312px 206.1px"><title>적도기니</title></path>

  <section class="panel" id="p2">
    <div class="photo"></div><div class="blob b1"></div><div class="blob b2"></div>
    <div class="inner">
      <div>
        <span class="eyebrow a" style="--d:.5s">10 Years in the Field</span>
        <h1 class="a" style="--d:.7s">교실이 아닌,<br><span class="accent">현장에서 배운</span><br>10년</h1>
        <p class="sub a" style="--d:1s">도미니카공화국 · 적도기니 · 칠레</p>

      <div class="visual a" style="--d:.6s">
        <div class="map">
          <svg viewBox="0 0 1000 520">
            <g class="grid" id="mapgrid"></g><g id="cities"></g>
            <path class="route" d="M853,146 C700,60 480,80 305,198 C380,230 470,250 529,246 C480,300 380,330 296,366"/>
            <g class="pin" style="--d:1.0s"><circle class="pulse" cx="853" cy="146" r="14"/><circle cx="853" cy="146" r="11" fill="#0f1a3a"/><text x="853" y="110" text-anchor="middle">대한민국</text></g>
            <g class="pin" style="--d:1.8s"><circle class="pulse" cx="305" cy="198" r="14"/><circle cx="305" cy="198" r="11" fill="#ff5d3a"/><text x="280" y="180" text-anchor="end">도미니카공화국</text></g>
            <g class="pin" style="--d:2.5s"><circle class="pulse" cx="529" cy="246" r="14"/><circle cx="529" cy="246" r="11" fill="#ff5d3a"/><text x="555" y="258">적도기니</text></g>
            <g class="pin" style="--d:3.2s"><circle class="pulse" cx="296" cy="366" r="14"/><circle cx="296" cy="366" r="11" fill="#ff5d3a"/><text x="322" y="378">칠레</text></g>

  <!-- 3 -->
  <section class="panel" id="p3">
    <div class="photo"></div><div class="blob b1"></div><div class="blob b2"></div>
    <div class="inner">
      <div>
        <span class="eyebrow a" style="--d:.5s">Accredited</span>
        <h1 class="a" style="--d:.7s">인가받은 교육,<br><span class="accent">검증된 강사</span></h1>
        <p class="sub a" style="--d:1s">다인원격평생교육직업학원</p>

      <div class="visual">
        <div class="seals">
          <div class="seal a" style="--d:.8s"><div><div class="y">2024</div><div class="t">교육부 인가<br>원격평생교육직업학원</div></div></div>
          <div class="seal a" style="--d:1.1s"><div><div class="y">2025</div><div class="t">캐럿글로벌<br>B2B 우수강사</div></div></div>
        </div>

  <!-- 5 -->
  <section class="panel" id="p5">
    <div class="photo"></div><div class="blob b1"></div><div class="blob b2"></div>
    <div class="inner">
      <div>
        <span class="eyebrow a" style="--d:.5s">Start Today</span>
        <h1 class="a" style="--d:.7s">오늘 시작하면,<br><span class="accent">내일이 바뀝니다</span></h1>
        <p class="sub a" style="--d:1s">다인에듀와 함께, 스페인어로 세계와 대화하세요</p>
        <div class="cta a" style="--d:1.3s">
          <a class="btn main" id="enterBtn" href="#">홈페이지 둘러보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="btn ghost" id="applyBtn" href="#">수강신청</a>

  <div class="wipe" id="wipe"><i></i><i></i><i></i></div>

  <footer class="bottom">
    <div class="dots" id="dots"></div>
    <div class="counter" id="counter">01 / 04</div>
    <div class="ctrl">
      <button id="prev" title="이전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button id="pause" title="일시정지"><svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <button id="next" title="다음"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </footer>
</div>

<script>
/* ============================================================
   CONFIG — 여기만 수정하면 됩니다
   ============================================================ */
const CONFIG = {
  duration: 6000,              // 패널 1장이 머무는 시간(ms)
  loopLast: false,             // true: 마지막 장 후 처음으로 반복
  autoRedirect: 0,             // 마지막 장 후 자동 홈 이동(ms). 0 = 안 함
  siteUrl: 'https://www.dainedu.net',
  links: {                     // 크리에이터링크 메뉴 주소로 교체
    enter:   'https://www.dainedu.net',
    apply:   'https://www.dainedu.net',
    contact: 'https://www.dainedu.net'
  },
  images: ['', '', '', '']  // 패널별 배경 사진 (비우면 모션그래픽만)
};

const panels = [...document.querySelectorAll('.panel')];
const dotsEl = document.getElementById('dots');
const counter = document.getElementById('counter');
const wipe = document.getElementById('wipe');
document.documentElement.style.setProperty('--dur', CONFIG.duration + 'ms');
document.getElementById('enterBtn').href = CONFIG.links.enter;
document.getElementById('applyBtn').href = CONFIG.links.apply;
document.getElementById('contactBtn').href = CONFIG.links.contact;

panels.forEach((p, i) => {
  const ph = p.querySelector('.photo');
  if (CONFIG.images[i]) { ph.style.backgroundImage = `url("${CONFIG.images[i]}")`; ph.classList.add('has'); }
  const d = document.createElement('button'); d.className = 'dot'; d.innerHTML = '<i></i>';
  d.onclick = () => go(i); dotsEl.appendChild(d);
});

/* 1: 흘러가는 인사말 */
(() => {
  const words = ['Hola', '¡Buenos días!', 'Gracias', '¿Qué tal?', 'Mucho gusto', '¡Vamos!'];
  const box = document.getElementById('drift');
  words.forEach((w, i) => {
    const s = document.createElement('span'); s.textContent = w;
    s.style.top = (8 + i * 15) + '%';
    s.style.fontSize = (4 + (i % 3) * 1.6) + 'vw';
    s.style.animationDuration = (140 + i * 25) + 's';
    s.style.animationDelay = -(i * 37) + 's';
    box.appendChild(s);
  });
})();

/* 2: 지도 격자 + 도시 점 */
(() => {
  let html = '';
  for (let x = 0; x <= 1000; x += 50) html += `<line x1="${x}" y1="0" x2="${x}" y2="520"/>`;
  for (let y = 0; y <= 520; y += 52) html += `<line x1="0" y1="${y}" x2="1000" y2="${y}"/>`;
  document.getElementById('mapgrid').innerHTML = html;
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const bands = [[120, 330, 90, 300], [420, 560, 110, 330], [520, 900, 80, 260], [560, 700, 260, 420], [230, 360, 230, 440], [780, 900, 300, 400]];
  let dots = '';
  bands.forEach(([x1, x2, y1, y2]) => { for (let i = 0; i < 38; i++) { const x = x1 + rnd() * (x2 - x1), y = y1 + rnd() * (y2 - y1); dots += `<circle class="city" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1 + rnd() * 2.2).toFixed(1)}" opacity="${(.3 + rnd() * .6).toFixed(2)}"/>`; } });
  document.getElementById('cities').innerHTML = dots;
})();

/* 슬라이드 엔진 */
let cur = -1, timer = null, paused = false, busy = false;
function go(i) {
  if (busy || i === cur) return;
  if (i >= panels.length) { if (CONFIG.loopLast) i = 0; else return; }
  if (i < 0) i = panels.length - 1;
  busy = true; clearTimeout(timer);
  wipe.classList.remove('go'); void wipe.offsetWidth; wipe.classList.add('go');
  const prev = panels[cur];
  if (prev) { prev.classList.remove('active'); prev.classList.add('leave'); }
  const nextP = panels[i];
  nextP.classList.remove('leave');
  nextP.style.transition = 'none'; nextP.style.transform = 'translateX(-100%)'; void nextP.offsetWidth;
  nextP.style.transition = ''; nextP.style.transform = '';
  setTimeout(() => nextP.classList.add('active'), 180);
  cur = i;
  [...dotsEl.children].forEach((d, k) => { d.classList.toggle('done', k < i); d.classList.remove('cur'); if (k === i) { d.querySelector('i').style.animationDuration = (+panels[i].dataset.dur || CONFIG.duration) + 'ms'; void d.offsetWidth; d.classList.add('cur'); } });
  counter.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(panels.length).padStart(2, '0');
  setTimeout(() => { if (prev) prev.classList.remove('leave'); busy = false; }, 1150);
  schedule();
}
function schedule() {
  clearTimeout(timer);
  if (paused) return;
  if (cur === panels.length - 1 && !CONFIG.loopLast) {
    if (CONFIG.autoRedirect > 0) timer = setTimeout(() => location.href = CONFIG.siteUrl, CONFIG.autoRedirect);
    return;
  }
  timer = setTimeout(() => go(cur + 1), +panels[cur].dataset.dur || CONFIG.duration);
}
document.getElementById('next').onclick = () => go(cur + 1);
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('pause').onclick = function () {
  paused = !paused;
  document.getElementById('pauseIcon').innerHTML = paused ? '<path d="M8 5v14l11-7z"/>' : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  dotsEl.children[cur].querySelector('i').style.animationPlayState = paused ? 'paused' : 'running';
  schedule();
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'Escape') location.href = CONFIG.siteUrl;
});
let tx = null;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
document.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1)); tx = null; });
setTimeout(() => go(0), 250);
</script>
